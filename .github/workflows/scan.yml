name: Skanowanie banerów

# Sprawdza nowe filmy (klatka co sekundę), odświeża wyświetlenia filmów z banerem i publikuje panel
# na GitHub Pages. Harmonogram jest co 15 minut, ale GitHub uruchamia go nieregularnie (zwykle co 1-6 h). Ręcznie: zakładka Actions -> Skanowanie banerów -> Run workflow.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      rescan:
        description: "Przeskanuj od nowa wszystkie filmy"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Narzędzia
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install --quiet -U yt-dlp opencv-python-headless numpy

      - name: Skanuj nowe filmy
        # przy pushu tylko publikujemy, skanowanie robi harmonogram i ręczne uruchomienie
        if: github.event_name != 'push'
        run: python scripts/scan.py ${{ inputs.rescan && '--rescan --budget 2100' || '' }}

      - name: Zapisz wyniki
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- data/ || [ -n "$(git ls-files --others -- data/)" ]; then
            git config user.name "licznik-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -q -m "Wyniki bota"
            git pull -q --rebase origin main
            git push -q
          fi

      - name: Złóż stronę
        run: |
          mkdir _site
          cp -r index.html data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
