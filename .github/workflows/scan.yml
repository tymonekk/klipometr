name: Skanowanie banerów

# Co 30 minut: sprawdza nowe filmy (klatka co sekundę), zapisuje wynik do data/banners.json
# i publikuje panel na GitHub Pages. Ręcznie: zakładka Actions -> Skanowanie banerów -> Run workflow.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Narzędzia
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install --quiet -U yt-dlp opencv-python-headless numpy

      - name: Skanuj nowe filmy
        # przy pushu tylko publikujemy, skanowanie robi harmonogram i ręczne uruchomienie
        if: github.event_name != 'push'
        run: python scripts/scan.py

      - name: Zapisz wyniki
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- data/banners.json; then
            git config user.name "licznik-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/banners.json
            git commit -q -m "Wyniki skanowania"
            git pull -q --rebase origin main
            git push -q
          fi

      - name: Złóż stronę
        run: |
          mkdir _site
          cp -r index.html data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
